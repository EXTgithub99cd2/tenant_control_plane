<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="/static/style.css"><title>Control Plane</title></head><body><main><header><h1>Tenant Control Plane</h1><div class="actions"><a class="button secondary" href="/inbox">Inbox</a><a class="button secondary" href="/imports/history">Imports</a><a class="button secondary" href="/observability">Observability</a></div></header><div class="grid"><section class="card"><h2>Create tenant</h2><form method="post" action="/tenants"><input name="name" placeholder="Name" required><input name="slug" placeholder="slug" required><button>Create</button></form></section><section class="card"><h2>Provision database</h2><form method="post" action="/databases"><select name="tenant_id" required>{% for t in tenants %}<option value="{{t.id}}">{{t.name}}</option>{% endfor %}</select><input name="name" placeholder="database_name" required><select name="engine">{% for e in engines %}<option>{{e}}</option>{% endfor %}</select><input type="password" name="owner_password" placeholder="PostgreSQL owner password"><button>Provision</button></form></section></div><section class="card"><table><tr><th>Tenant</th><th>Database</th><th>Engine</th><th>Actions</th></tr>{% for d in databases %}<tr><td>{{d.tenant_name}}</td><td>{{d.requested_name}}</td><td>{{d.engine}}</td><td class="actions"><a class="button" href="/databases/{{d.id}}/manage">Manage data</a><form method="post" action="/databases/{{d.id}}/backup"><button>Backup</button></form></td></tr>{% endfor %}</table></section></main></body></html>
