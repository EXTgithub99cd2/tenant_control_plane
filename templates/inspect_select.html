<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="/static/style.css"><title>Select worksheet</title></head><body><main><header><div><p class="eyebrow">FILE INSPECTION</p><h1>Select worksheet</h1><p>{{file.original_filename}}</p></div><a class="button" href="/inbox/files/{{file.id}}">File metadata</a></header><section class="card"><p>This workbook contains multiple worksheets. Select one to inspect.</p><div class="dataset-list">{% for d in datasets %}<a class="dataset" href="/inbox/files/{{file.id}}/inspect/report?dataset={{d.name|urlencode}}"><strong>{{d.name}}</strong><span>{{d.kind}} · {{'visible' if d.visible else 'hidden'}}</span></a>{% endfor %}</div></section></main></body></html>
