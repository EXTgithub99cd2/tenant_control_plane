<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="/static/style.css"><title>Import mapping</title></head><body><main><header><div><p class="eyebrow">COLUMN MAPPING CONFIRMATION</p><h1>Create table from statement</h1></div></header><section class="card"><form method="post" action="/imports/create-table"><input type="hidden" name="file_id" value="{{file_id}}"><input type="hidden" name="dataset" value="{{dataset}}"><input type="hidden" name="header_row" value="{{structure.header_row}}"><input type="hidden" name="data_start_row" value="{{structure.data_start_row}}"><input type="hidden" name="data_end_row" value="{{structure.data_end_row or ''}}"><input type="hidden" name="document_header_end" value="{{structure.document_header_end or ''}}"><input type="hidden" name="column_count" value="{{columns|length}}"><label>Target database<select name="database_id" required>{% for d in databases %}<option value="{{d.id}}">{{d.tenant_name}} / {{d.requested_name}} ({{d.engine}})</option>{% endfor %}</select></label><label>Target table<input name="target_table" required></label><table><tr><th>Source</th><th>Target</th><th>Logical type</th><th>Nullable</th></tr>{% for c in columns %}<tr><td>{{c.source_name}}<input type="hidden" name="source_{{loop.index0}}" value="{{c.source_name}}"></td><td><input name="target_{{loop.index0}}" value="{{c.target_name}}"></td><td><select name="type_{{loop.index0}}">{% for x in ['string','integer','decimal','boolean','datetime','binary'] %}<option {% if x==c.logical_type %}selected{% endif %}>{{x}}</option>{% endfor %}</select></td><td><input type="checkbox" name="nullable_{{loop.index0}}" value="true" {% if c.nullable %}checked{% endif %}></td></tr>{% endfor %}</table><fieldset><legend>Recurring statement template</legend><label><input type="checkbox" name="save_template" value="true" checked> Save this mapping as a template</label><label>Template name<input name="template_name" value="{{dataset}} statement"></label><label><input type="checkbox" name="auto_process_allowed" value="true" {% if default_auto %}checked{% endif %}> Allow automatic processing when this template is detected</label></fieldset><button>Create staging table, import, and publish atomically</button></form></section></main></body></html>
